# The drive's room server (src/index.ts). `npm run dev` runs it locally on :8787; `npm run deploy` publishes it to the
# Cloudflare account wrangler is logged in to. Then set NEXT_PUBLIC_MP_URL (wss://<name>.<account>.workers.dev) in Vercel.
name = "explore-wayanad-rooms"
main = "src/index.ts"
compatibility_date = "2026-10-01"

[durable_objects]
bindings = [
  { name = "ROOM", class_name = "Room" },
  { name = "LOBBY", class_name = "Lobby" },
]

[[migrations]]
tag = "v1"
new_classes = ["Room", "Lobby"]
