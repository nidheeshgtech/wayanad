# Drive Wayanad's Instagram auto-reply (src/index.ts): comment PLAY → the link in a DM. `npm run deploy` publishes it to
# the Cloudflare account wrangler is logged in to; its webhook URL is https://<name>.<account>.workers.dev/webhook.
# Secrets (never in this file): npx wrangler secret put APP_SECRET | VERIFY_TOKEN (IG_TOKEN optional; the /auth login
# keeps the token in KV instead)
name = "drive-wayanad-instagram"
main = "src/index.ts"
compatibility_date = "2026-10-01"

[vars]
APP_ID = "1691463982608126"
OWNER = "drivewayanad.official"

[[kv_namespaces]]
binding = "SEEN"
id = "3224691f393e4c3fa52449b474d39d3e"

# every 5 minutes: answer new comments asking for the game (src/index.ts poll)
[triggers]
crons = ["*/5 * * * *"]
