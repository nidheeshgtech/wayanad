# The iPhone app's Xcode project, generated by XcodeGen:  cd ios-app && xcodegen
# (the .xcodeproj is made from this file; edit this, not the project). See README.md.
name: DriveWayanad
options:
  bundleIdPrefix: com.drivewayanad
  deploymentTarget:
    iOS: "16.0"
  createIntermediateGroups: true
settings:
  base:
    MARKETING_VERSION: "1.0"
    CURRENT_PROJECT_VERSION: "1"
    SWIFT_VERSION: "5.0"
    TARGETED_DEVICE_FAMILY: "1"          # iPhone only for now
    DEVELOPMENT_TEAM: ""                 # set to the Apple Developer team id once enrolled
targets:
  DriveWayanad:
    type: application
    platform: iOS
    sources:
      - DriveWayanad
    settings:
      base:
        PRODUCT_NAME: DriveWayanad
        PRODUCT_BUNDLE_IDENTIFIER: com.drivewayanad.app
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        CODE_SIGN_STYLE: Automatic
        INFOPLIST_FILE: DriveWayanad/Info.plist
        GENERATE_INFOPLIST_FILE: NO
      configs:
        # Game Center needs a paid developer account to sign; a free account (testing on your own iPhone) builds Debug
        Release:
          CODE_SIGN_ENTITLEMENTS: DriveWayanad/DriveWayanad.entitlements
    info:
      path: DriveWayanad/Info.plist
      properties:
        CFBundleDisplayName: Drive Wayanad
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        LSRequiresIPhoneOS: true
        LSApplicationCategoryType: public.app-category.racing-games
        UILaunchScreen:
          UIColorName: LaunchBackground
          UIImageName: LaunchLogo
        UIStatusBarHidden: true
        UIViewControllerBasedStatusBarAppearance: true
        UIRequiresFullScreen: true
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
        UIRequiredDeviceCapabilities:
          - arm64
        NSMicrophoneUsageDescription: Voice chat with your friends in a private room. Your voice goes straight to their phones and is never recorded.
        ITSAppUsesNonExemptEncryption: false
        NSAppTransportSecurity:
          NSAllowsLocalNetworking: true   # (Debug testing against a dev server on the Mac; the game itself is https)
        LSApplicationQueriesSchemes:
          - whatsapp
          - instagram
